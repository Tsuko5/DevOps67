name: Build and Test Application

on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - master

jobs:
  build_test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Verify files
        run: ls -la

      - name: Build Docker image
        run: docker build -t my-app:1.0.0 -f api/Dockerfile ./api
